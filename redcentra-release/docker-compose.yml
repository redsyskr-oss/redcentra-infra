# RedCentra — 폐쇄망 배포용 Compose
#
# - 프로젝트명을 디렉터리 이름에 맡기지 않고 명시한다. 디렉터리명 기본값이 다른 프로젝트와
#   겹치면 docker compose가 남의 컨테이너를 같은 프로젝트의 orphan으로 오인하는 문제가
#   실제 발생했다(2026-07-11). 네임드 볼륨은 redcentra_* 접두어로 생성된다.
# - 기본 `docker compose up -d` 는 인프라만 기동한다.
#   api-server / nginx 는 `docker compose --profile app up -d` 로 기동한다.
# - 모든 비밀값은 같은 디렉터리의 .env 에서 주입한다. .env 는 git에 올리지 않는다.
# - 이미지 태그는 전부 고정 태그. latest 금지 (DEPLOYMENT.md §1 표와 일치 유지).
name: redcentra

services:

  nginx:
    profiles: ["app"] # api-server와 함께 기동 — 프록시 대상이 없으면 upstream 오류로 기동 실패
    image: nginx:1.30.3
    container_name: redcentra-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" # HTTPS 적용 시 사용
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api-server
    networks:
      - redcentra-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine # 실제 3.13.7
    container_name: redcentra-rabbitmq
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      # AMQP(5672)는 api-server가 내부 네트워크로 접속하므로 호스트 노출 불필요.
      # 호스트의 다른 프로세스가 직접 붙어야 할 때만 아래 주석을 해제한다.
      # - "5672:5672"
      - "15672:15672" # Management UI — 운영 이관 시 방화벽/접근통제 필수
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - redcentra-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mariadb:
    image: mariadb:11.8.8-noble
    container_name: redcentra-mariadb
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USERNAME}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_RANDOM_ROOT_PASSWORD=yes # 앱은 redcentra 계정만 사용 — root 비밀번호 불요
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    # 컨테이너 간 통신은 내부 네트워크로 동작 — 호스트에서 DB 툴로 직접 붙을 때만 해제
    # ports:
    #   - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - redcentra-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine # 실제 7.4.9
    container_name: redcentra-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # 내부 네트워크 전용 — 호스트에서 redis-cli로 직접 붙을 때만 해제
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    # 이 줄이 빠지면 기본 네트워크에 붙어 api-server가 "redis" 이름으로 못 찾는다
    networks:
      - redcentra-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD} # healthcheck에서 참조

  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: redcentra-opensearch
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - discovery.type=single-node # 단일 노드 운영 필수 설정
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      # 단일 노드 최적화: JVM 힙 제한 (기본 4~8GB → 512MB)
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # api-server Logback 어펜더가 인증/TLS 없이 _bulk 로 로그 전송 — 내부망 전용 전제
      - DISABLE_SECURITY_PLUGIN=true
    # 보안 플러그인이 꺼져 있으므로 호스트 노출 금지 — api-server/grafana는 내부 네트워크로 접속.
    # 호스트에서 인덱스를 직접 조회해야 하면 임시로만 해제하고, 확인 후 반드시 다시 닫는다.
    # ports:
    #   - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - redcentra-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    container_name: redcentra-seaweedfs
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    # master+volume+filer+s3 단일 프로세스(단일 서버 운영 전제).
    # s3.json 의 access/secret 키는 api-server 의 SEAWEEDFS_ACCESS_KEY/SECRET_KEY 와 반드시 일치.
    # s3.port(8333)가 api-server 가 presigned URL 을 서명하는 endpoint 다.
    command: >
      server
      -dir=/data
      -master.volumeSizeLimitMB=1024
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
    # 마스터(9333)·볼륨(8080)·필러(8888)는 내부 통신 전용 — 노출하지 않는다.
    # 8333은 presigned URL 을 브라우저가 직접 호출하는 구조라면 호스트 노출이 필요하다.
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - redcentra-network

  grafana:
    # opensearch 데이터소스 플러그인 내장 커스텀 빌드 (DEPLOYMENT.md §2-2)
    # GF_INSTALL_PLUGINS 는 기동 시 외부 다운로드를 시도하므로 폐쇄망에서 사용 금지
    image: redcentra/grafana-oss:13.0.2-opensearch
    container_name: redcentra-grafana
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    # React 개발 서버가 3000을 쓰므로 호스트 쪽은 3001로 매핑
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - redcentra-network
    depends_on:
      opensearch:
        condition: service_healthy

  api-server:
    profiles: ["app"]
    # 폐쇄망에서는 build 하지 않는다 — 인터넷망에서 빌드한 이미지를 tar 반입 후 load.
    # (개발 PC에서 빌드할 때는 아래 build 블록의 주석을 해제해 사용)
    image: redcentra-api:${API_VERSION:-0.1.0}
    # build:
    #   context: .
    #   dockerfile: api-server/Dockerfile
    container_name: redcentra-api-server
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      # 컨테이너에서는 항상 prod 프로파일 — application-prod.yml 이 DB_HOST/REDIS_HOST 기본값을
      # 서비스명(mariadb/redis)으로 잡는다. local 프로파일은 호스트 gradlew bootRun 전용.
      - SPRING_PROFILES_ACTIVE=prod
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SEAWEEDFS_ENDPOINT=http://seaweedfs:8333
      - SEAWEEDFS_ACCESS_KEY=${SEAWEEDFS_ACCESS_KEY}
      - SEAWEEDFS_SECRET_KEY=${SEAWEEDFS_SECRET_KEY}
      - LOGGING_OPENSEARCH_URL=http://opensearch:9200
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - redcentra-network

volumes:
  mariadb-data:
  redis-data:
  opensearch-data:
  grafana-data:
  seaweedfs-data:
  rabbitmq-data:

networks:
  redcentra-network:
    driver: bridge
